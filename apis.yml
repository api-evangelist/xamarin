aid: xamarin
name: Xamarin
description: >-
  Xamarin was the San Francisco company behind the Mono-based cross-platform
  mobile development framework, letting developers build native iOS, Android,
  and Mac apps from a single C#/.NET codebase. Backed by investors including
  Insight Partners, it was acquired by Microsoft in 2016. Microsoft retired
  the Xamarin SDKs on May 1, 2024, with Xamarin.Forms succeeded by .NET MAUI.
  Xamarin shipped developer tooling and SDK packages rather than a public web
  API; its NuGet packages, docs, and GitHub organization remain its primary
  artifacts.
